name: shell

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "home/**"
      - "nix/ssh_config"
      - "profiles/**"
      - "tests/**"
      - "scripts/pre-wipe-inventory.sh"
      - ".github/workflows/shell.yml"

permissions:
  contents: read

jobs:
  zsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Start zsh in a temporary HOME and check the layout
        run: tests/shell.sh
      - name: Check that each shell test fails on a broken copy
        run: tests/mutate.sh
      - name: Check the reply-language hook and that each of its tests fails on a broken copy
        run: |
          tests/reply-language.sh
          tests/mutate-reply-language.sh
      - name: Check the git files in a temporary HOME and that each check fails on a broken copy
        run: |
          tests/git.sh
          tests/mutate-git.sh
      - name: Check the ssh config with ssh -G and that each check fails on a broken copy
        run: |
          tests/ssh.sh
          tests/mutate-ssh.sh
      - name: Check the pre-wipe inventory and that each of its tests fails on a broken copy
        run: |
          tests/pre-wipe-inventory.sh
          tests/mutate-pre-wipe-inventory.sh
