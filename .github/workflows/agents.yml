name: agents

# No path filter: every pull request reports agents-passed, so it can be
# required. The changes job decides whether the steps run; a step runs unless
# that decision is 'false', so a push, which skips it, runs every step.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # A pull request runs a mutation script only when one of its inputs changed.
  MUTATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.guard.outputs.self == 'true' && 'true' || steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run every check when the decision code itself changed
        id: guard
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # The decision below runs this pull request's own copy of the
          # script, so a change to it must not decide for itself. Any git
          # error also lands in the else branch, which runs every check.
          if git diff --quiet "origin/$BASE...HEAD" -- tests/workflow-changed.sh tests/lib; then
            echo self=false >>"$GITHUB_OUTPUT"
          else
            echo self=true >>"$GITHUB_OUTPUT"
          fi
      - name: Decide whether the pull request changed an input of this workflow
        id: inputs
        if: github.event_name == 'pull_request' && steps.guard.outputs.self != 'true'
        run: tests/workflow-changed.sh agents >>"$GITHUB_OUTPUT"

  # The Linux checks run in the first shard below, which keeps the jobs a pull
  # request starts at once under GitHub's limit.
  settings:
    needs: changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    # With every step skipped, the job needs no macOS runner.
    runs-on: ${{ needs.changes.outputs.changed == 'false' && 'ubuntu-latest' || matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.changed != 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.changes.outputs.changed != 'false'
      - name: Generate settings.json for the personal and work profiles and check it
        if: needs.changes.outputs.changed != 'false'
        run: tests/agents.sh
      - name: Check that the settings checks that depend on macOS fail on a broken generator
        if: needs.changes.outputs.changed != 'false'
        run: MUTATE_OS=macos tests/mutate-agents.sh

  mutants:
    name: mutants (${{ matrix.os }}, ${{ matrix.runner }}, ${{ matrix.shard }})
    needs: changes
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runner: mutate-agents.sh, shard: 0/2 }
          - { os: ubuntu-latest, runner: mutate-agents.sh, shard: 1/2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.changed != 'false'
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.changes.outputs.changed != 'false'
      - name: Generate settings.json for the personal and work profiles and check it
        if: needs.changes.outputs.changed != 'false' && startsWith(matrix.shard, '0/')
        run: tests/agents.sh
      - name: Check that each settings check fails on a deliberately broken generator
        if: needs.changes.outputs.changed != 'false'
        env:
          MUTATE_OS: linux
          MUTATE_SHARD: ${{ matrix.shard }}
          RUNNER: ${{ matrix.runner }}
        run: tests/"$RUNNER"

  agents-passed:
    if: always()
    needs: [settings, mutants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
