name: hooks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "home/.claude/hooks/**"
      - "nix/agents.nix"
      - "flake.nix"
      - "flake.lock"
      - "hosts/**"
      - "tests/hooks.sh"
      - "tests/mutate-hooks.sh"
      - "tests/lib/mutate.sh"
      - "tests/fixtures/hooks/**"
      - "tests/reply-language.sh"
      - "tests/fixtures/reply-language/**"
      - ".github/workflows/hooks.yml"

permissions:
  contents: read

env:
  # A pull request runs a mutation script only when one of its inputs changed.
  MUTATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

jobs:
  # The Linux checks run in the first shard below, which keeps the jobs a pull
  # request starts at once under GitHub's limit.
  guards:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Store paths built here, in the GitHub Actions cache. A path hashes every
      # input of its derivation, so a changed input is built, never restored, and
      # a pull request's entries stay on its merge ref, out of reach of main.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Build the guard hooks
        run: nix build --no-link ".#block-destructive-db" ".#block-sensitive-read" ".#check-reply-language"
      - name: Check each guard against its fixtures under an empty PATH
        run: tests/hooks.sh
      - name: Check the built reply-language hook against its fixtures
        run: tests/reply-language.sh "$(nix build --no-link --print-out-paths .#check-reply-language)/bin/check-reply-language"

  # Linux only: the guards run on the same pinned Nix tools on both OSes, so a
  # second run adds time, not coverage.
  mutants:
    name: mutants (${{ matrix.os }}, ${{ matrix.runner }}, ${{ matrix.shard }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runner: mutate-hooks.sh, shard: 0/5 }
          - { os: ubuntu-latest, runner: mutate-hooks.sh, shard: 1/5 }
          - { os: ubuntu-latest, runner: mutate-hooks.sh, shard: 2/5 }
          - { os: ubuntu-latest, runner: mutate-hooks.sh, shard: 3/5 }
          - { os: ubuntu-latest, runner: mutate-hooks.sh, shard: 4/5 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build the guard hooks
        if: startsWith(matrix.shard, '0/')
        run: nix build --no-link ".#block-destructive-db" ".#block-sensitive-read" ".#check-reply-language"
      - name: Check each guard against its fixtures under an empty PATH
        if: startsWith(matrix.shard, '0/')
        run: tests/hooks.sh
      - name: Check the built reply-language hook against its fixtures
        if: startsWith(matrix.shard, '0/')
        run: tests/reply-language.sh "$(nix build --no-link --print-out-paths .#check-reply-language)/bin/check-reply-language"
      - name: Check that each guard check fails on a deliberately broken guard
        env:
          MUTATE_OS: linux
          MUTATE_SHARD: ${{ matrix.shard }}
          RUNNER: ${{ matrix.runner }}
        run: tests/"$RUNNER"

  hooks-passed:
    if: always()
    needs: [guards, mutants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
