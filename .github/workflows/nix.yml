name: nix

# No path filter: every pull request reports nix-passed, so it can be
# required. The changes job decides whether the steps run; a step runs unless
# that decision is 'false', so a push, which skips it, runs every step.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.guard.outputs.self == 'true' && 'true' || steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run every check when the decision code itself changed
        id: guard
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # The decision below runs this pull request's own copy of the
          # script, so a change to it must not decide for itself. Any git
          # error also lands in the else branch, which runs every check.
          if git diff --quiet "origin/$BASE...HEAD" -- tests/workflow-changed.sh tests/lib; then
            echo self=false >>"$GITHUB_OUTPUT"
          else
            echo self=true >>"$GITHUB_OUTPUT"
          fi
      - name: Decide whether the pull request changed an input of this workflow
        id: inputs
        if: github.event_name == 'pull_request' && steps.guard.outputs.self != 'true'
        env:
          MUTATE_BASE: origin/${{ github.base_ref }}
        run: tests/workflow-changed.sh nix >>"$GITHUB_OUTPUT"

  darwin:
    needs: changes
    # With every step skipped, the job needs no macOS runner.
    runs-on: ${{ needs.changes.outputs.changed == 'false' && 'ubuntu-latest' || 'macos-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [personal-mac, work-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.changed != 'false'
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.changes.outputs.changed != 'false'
      - name: Check the licence of everything ${{ matrix.host }} installs
        if: needs.changes.outputs.changed != 'false'
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/licenses.sh
      - name: Check that the licence checks fail on a broken copy
        if: needs.changes.outputs.changed != 'false'
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/mutate-licenses.sh
      - name: Build the ${{ matrix.host }} system
        if: needs.changes.outputs.changed != 'false'
        env:
          HOST: ${{ matrix.host }}
        run: nix build --no-link ".#darwinConfigurations.${HOST}.system"
      - name: Check what the ${{ matrix.host }} profile gives the host
        if: needs.changes.outputs.changed != 'false'
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/packages.sh
      - name: Check the gh wrapper with a stub ghtkn
        if: needs.changes.outputs.changed != 'false' && matrix.host == 'personal-mac'
        run: tests/ghtkn.sh
      - name: Check that the per-user profile checks fail on a broken copy
        if: needs.changes.outputs.changed != 'false'
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/mutate-packages.sh per-user
      - name: Check that the ${{ matrix.host }} package set fails with another host's packages
        if: needs.changes.outputs.changed != 'false'
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/mutate-packages.sh per-host

  wsl:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.changed != 'false'
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.changes.outputs.changed != 'false'
      - name: Install zsh
        if: needs.changes.outputs.changed != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check the licence of everything wsl installs
        if: needs.changes.outputs.changed != 'false'
        run: tests/licenses.sh
      - name: Check that the licence checks fail on a broken copy
        if: needs.changes.outputs.changed != 'false'
        run: tests/mutate-licenses.sh
      - name: Build the wsl home configuration
        if: needs.changes.outputs.changed != 'false'
        run: nix build --no-link ".#homeConfigurations.\"$(nix eval --raw --file hosts/wsl.nix user)@wsl\".activationPackage"
      - name: Check what the wsl profile gives the host
        if: needs.changes.outputs.changed != 'false'
        run: tests/packages.sh
      - name: Check the gh wrapper with a stub ghtkn
        if: needs.changes.outputs.changed != 'false'
        run: tests/ghtkn.sh
      - name: Check that the gh wrapper checks fail on a broken copy
        if: needs.changes.outputs.changed != 'false'
        run: MUTATE_OS=linux tests/mutate-ghtkn.sh
      - name: Check that the host-independent package checks fail on a broken copy
        if: needs.changes.outputs.changed != 'false'
        run: tests/mutate-packages.sh common
      - name: Check that the wsl package set fails with another host's packages
        if: needs.changes.outputs.changed != 'false'
        run: tests/mutate-packages.sh per-host

  nix-passed:
    if: always()
    needs: [darwin, wsl]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
