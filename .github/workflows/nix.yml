name: nix

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "docs/design.md"
      - "home/**"
      - "hosts/**"
      - "nix/**"
      - "tests/**"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

jobs:
  darwin:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        host: [personal-mac, work-mac]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Store paths built here, in the GitHub Actions cache. A path hashes every
      # input of its derivation, so a changed input is built, never restored, and
      # a pull request's entries stay on its merge ref, out of reach of main.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Check the licence of everything ${{ matrix.host }} installs
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/licenses.sh
      - name: Check that the licence checks fail on a broken copy
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/mutate-licenses.sh
      - name: Build the ${{ matrix.host }} system
        env:
          HOST: ${{ matrix.host }}
        run: nix build --no-link ".#darwinConfigurations.${HOST}.system"
      - name: Check what the ${{ matrix.host }} profile gives the host
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/packages.sh
      - name: Check that the per-user profile checks fail on a broken copy
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/mutate-packages.sh per-user
      - name: Check that the ${{ matrix.host }} package set fails with another host's packages
        env:
          DOTFILES_HOST: ${{ matrix.host }}
        run: tests/mutate-packages.sh per-host

  wsl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      # Store paths built here, in the GitHub Actions cache. A path hashes every
      # input of its derivation, so a changed input is built, never restored, and
      # a pull request's entries stay on its merge ref, out of reach of main.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      - name: Check the licence of everything wsl installs
        run: tests/licenses.sh
      - name: Check that the licence checks fail on a broken copy
        run: tests/mutate-licenses.sh
      - name: Build the wsl home configuration
        run: nix build --no-link ".#homeConfigurations.\"$(nix eval --raw --file hosts/wsl.nix user)@wsl\".activationPackage"
      - name: Check what the wsl profile gives the host
        run: tests/packages.sh
      - name: Check that the host-independent package checks fail on a broken copy
        run: tests/mutate-packages.sh common
      - name: Check that the wsl package set fails with another host's packages
        run: tests/mutate-packages.sh per-host
