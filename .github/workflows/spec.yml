name: spec

# No path filter: every pull request reports tlc. The changes job decides
# whether its steps run; a step runs unless that decision is 'false', so a
# push, which skips it, runs every step.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.guard.outputs.self == 'true' && 'true' || steps.inputs.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run every check when the decision code itself changed
        id: guard
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          # The decision below runs this pull request's own copy of the
          # script, so a change to it must not decide for itself. Any git
          # error also lands in the else branch, which runs every check.
          if git diff --quiet "origin/$BASE...HEAD" -- tests/workflow-changed.sh tests/lib; then
            echo self=false >>"$GITHUB_OUTPUT"
          else
            echo self=true >>"$GITHUB_OUTPUT"
          fi
      - name: Decide whether the pull request changed an input of this workflow
        id: inputs
        if: github.event_name == 'pull_request' && steps.guard.outputs.self != 'true'
        env:
          MUTATE_BASE: origin/${{ github.base_ref }}
        run: tests/workflow-changed.sh spec >>"$GITHUB_OUTPUT"

  tlc:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.changed != 'false'
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: needs.changes.outputs.changed != 'false'
      - name: Model-check the specs and their mutants
        if: needs.changes.outputs.changed != 'false'
        run: nix shell nixpkgs#tlaplus18 nixpkgs#python3 --command spec/check.sh

  spec-passed:
    if: always()
    needs: [tlc]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
